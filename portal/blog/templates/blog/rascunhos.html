{% extends 'blog/base.html' %}

{% block conteudo %}
<h1 style="border-bottom-color: #f39c12;">Meus Rascunhos 📝</h1>

<p style="text-align: right;">
    <a href="{% url 'lista' %}" class="btn" style="background-color: #7f8c8d;">Voltar para Notícias</a>
</p>

<ul style="list-style-type: none; padding: 0;">
{% for post in posts %}
    <li style="background: #fdfae6; margin-bottom: 15px; padding: 15px; border-radius: 5px; border-left: 5px solid #f39c12;">
        <a href="{% url 'detalhe' post.id %}" style="text-decoration: none; color: #2c3e50;">
            <strong style="font-size: 1.2em;">{{ post.titulo }}</strong>
        </a><br>
        <small style="color: #7f8c8d;">Autor: {{ post.autor }} | Status: {{ post.status }}</small>
    </li>
{% empty %}
    <li style="text-align: center; color: #7f8c8d; padding: 20px;">Você não tem nenhum rascunho no momento.</li>
{% endfor %}
</ul>
{% endblock %}
