{% extends 'blog/base.html' %}

{% block conteudo %}
<h1 style="border-bottom-color: #e74c3c;">Confirmar Exclusão</h1>

<p>Tem certeza que deseja excluir a notícia "<strong>{{ post.titulo }}</strong>"? Esta ação não pode ser desfeita.</p>

<form method="POST" style="margin-top: 30px;">
    {% csrf_token %}
    <button type="submit" style="background-color: #e74c3c;">Sim, excluir notícia</button>
    <a href="{% url 'detalhe' post.id %}" style="margin-left: 15px; color: #7f8c8d; text-decoration: none; font-weight: bold;">Cancelar</a>
</form>
{% endblock %}
