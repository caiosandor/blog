{% extends 'blog/base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
    <div style="max-width: 520px; margin: 3rem auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; text-align: center;">
        <h1 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 0.75rem;">Excluir Matéria?</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.75rem;">
            Tem certeza que deseja excluir permanentemente <strong>"{{ post.titulo }}"</strong>? Esta ação não pode ser desfeita.
        </p>

        <form method="post" style="display: flex; justify-content: center; gap: 0.75rem;">
            {% csrf_token %}
            <a href="{% url 'detalhe' post.id %}" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sim, excluir matéria</button>
        </form>
    </div>
{% endblock %}
