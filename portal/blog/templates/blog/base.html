<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal de Notícias</title>
    <style>
        /* Estilos básicos para deixar tudo mais bonito */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        /* Estilo dos botões e links */
        a.btn, button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        a.btn:hover, button:hover {
            background-color: #2980b9;
        }
        /* Estilo do formulário */
        form p {
            display: flex;
            flex-direction: column;
        }
        input, textarea, select {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Mostra a data e hora atual -->
        <div style="text-align: center; color: #bdc3c7; font-size: 0.9em; margin-bottom: 20px; border-bottom: 1px solid #ecf0f1; padding-bottom: 10px;">
            📅 Hoje é {% now "d/m/Y" %} às {% now "H:i" %}
        </div>

        {% block conteudo %}
        {% endblock %}
        
    </div>
</body>
</html>
