{% extends 'blog/base.html' %}

{% block conteudo %}
<h1>{{ post.titulo }}</h1>
<p style="color: #7f8c8d; font-size: 0.9em; margin-top: -10px;">
    Publicado por <strong>{{ post.autor }}</strong> | Status: {{ post.status }}
</p>

<div style="margin-top: 20px; line-height: 1.6; font-size: 1.1em;">
    {{ post.conteudo|linebreaks }}
</div>

<div style="margin-top: 40px;">
    <a href="{% url 'editar' post.id %}" class="btn" style="background-color: #f1c40f; color: #333; margin-right: 10px;">Editar</a>
    <a href="{% url 'excluir' post.id %}" class="btn" style="background-color: #e74c3c; margin-right: 10px;">Excluir</a>
    <a href="{% url 'lista' %}" class="btn" style="background-color: #95a5a6;">&larr; Voltar para a lista</a>
</div>
{% endblock %}
